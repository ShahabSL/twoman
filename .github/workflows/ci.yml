name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: helper-agent/go.mod
          cache-dependency-path: helper-agent/go.mod

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r desktop_client/requirements.txt

      - name: Verify Python modules compile
        run: |
          python3 -m py_compile \
            twoman_protocol.py \
            twoman_crypto.py \
            twoman_dns.py \
            twoman_http.py \
            twoman_proxy.py \
            runtime_diagnostics.py \
            hidden_server/agent_watchdog.py \
            host/runtime/http_broker_daemon.py \
            scripts/benchmark_live_ceiling.py \
            desktop_client/models.py \
            desktop_client/runtime.py \
            desktop_client/controller.py \
            desktop_client/socks_gateway.py \
            desktop_client/tui.py \
            twoman_control/*.py \
            tests/test_twoman_dns.py \
            tests/test_twoman_proxy.py \
            tests/test_twoman_control_cpanel.py \
            tests/test_twoman_control_installer.py \
            tests/test_twoman_control_manager.py

      - name: Run Go helper-agent tests
        working-directory: helper-agent
        run: go test ./...

      - name: Run client CLI tests
        working-directory: client-cli
        run: go test ./...

      - name: Verify Node broker parses
        run: |
          node --check host/node_selector/broker.js
          node --check host/node_selector/app.js

      - name: Verify shell scripts parse
        run: |
          bash -n \
            scripts/install_twoman.sh \
            scripts/install_hidden_server_local.sh \
            scripts/deploy_hidden_server.sh \
            scripts/deploy_host.sh \
            scripts/deploy_host_node_selector.sh \
            scripts/deploy_host_passenger.sh \
            scripts/start_client.sh \
            scripts/build_client_cli_linux.sh \
            client-cli/install-linux.sh \
            tests/run_e2e_go_node_http.sh \
            tests/run_client_cli_e2e.sh \
            tests/run_desktop_client_e2e.sh

      - name: Run Go node backend smoke test
        run: bash tests/run_e2e_go_node_http.sh

      - name: Run client CLI end-to-end test
        run: bash tests/run_client_cli_e2e.sh

      - name: Run desktop TUI tests
        run: python3 -m unittest tests/test_desktop_client_tui.py

      - name: Run installer tests
        run: python3 -m unittest tests.test_twoman_control_cpanel tests.test_twoman_control_installer tests.test_twoman_control_manager tests.test_twoman_control_registry

      - name: Run desktop client end-to-end test
        run: bash tests/run_desktop_client_e2e.sh

      - name: Build frozen Linux desktop client
        run: ./desktop_client/build_linux.sh

      - name: Install Tauri Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 12
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check Tauri desktop app
        run: cargo check --manifest-path desktop_app/src-tauri/Cargo.toml

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: helper-agent/go.mod
          cache-dependency-path: helper-agent/go.mod

      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            echo "sdkmanager not found at ${SDKMANAGER}" >&2
            find "${SDK_ROOT}" -name sdkmanager -type f -print >&2 || true
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "ndk;27.0.12077973"

      - name: Build Android debug APK
        working-directory: android-client
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          ./gradlew assembleArm64Debug
